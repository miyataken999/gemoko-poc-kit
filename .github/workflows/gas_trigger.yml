name: Deploy Code to GAS via Clasp

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 手動実行ボタン用

jobs:
  deploy-to-gas:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: clasp のグローバルインストール
        run: npm install -g @google/clasp

      - name: 認証情報（.clasprc.json）と設定（.clasp.json）の生成
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          # 1. ホームディレクトリに Google 認証トークンを配置
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          
          # 2. プロジェクト直下に .clasp.json を自動生成
          cat <<EOF > .clasp.json
          {
            "scriptId": "$GAS_SCRIPT_ID",
            "rootDir": "./src"
          }
          EOF

      - name: GAS へのコード反映 (clasp push)
        run: |
          echo "🚀 GAS へ最新コードをアップロード中..."
          clasp push -f
          echo "🎉 GAS へのアップロードが完了しました！"
